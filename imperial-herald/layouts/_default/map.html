<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Карта Империи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body{
      background: #0a0a14; 
      color: #ffffff;
    }
    #map {
      width: 100%;
      height: 80vh;
      border: 2px solid #92057b;
      margin-top: 20px;
      background: #0a0a14;  
    }
    .leaflet-control-layers {
      background: #1a1a24 !important;
      border: 2px solid #92057b !important;
    }
    .leaflet-control-layers-list {
      background: #1a1a24 !important;
    }
  </style>
</head>

<header class="header">
    <a style="display: block;flex-wrap: wrap;justify-content: space-between;max-width: calc(var(--nav-width) + var(--gap) * 2);margin-inline-start: auto;margin-inline-end: auto;line-height: var(--header-height);font-size: 24px;
    font-weight: 700;color: #ffffff;text-decoration: none;padding: 20px;padding-bottom: 0px;" href="/" accesskey="h" title="Имперский Вестник (Alt + H)">Имперский Вестник</a>
</header>


<body>

<h1 style="text-align: center;">🦉 Интерактивная Карта Империи</h1>

<div id="map"></div>

<script>
  // Инициализация карты
  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 2
  });

  var imperialIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-violet.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });

  var bounds = [[0,0], [1024,1024]];

  var imperialLayer = L.layerGroup();
  var imperialImage = L.imageOverlay('/images/map.svg', bounds).addTo(imperialLayer);
  
  L.marker([510, 190], {icon: imperialIcon}).addTo(imperialLayer)
    .bindPopup('<b>Дерака</b><br>Столица Империи.');
  L.marker([700, 260], {icon: imperialIcon}).addTo(imperialLayer)
    .bindPopup('<b>Аркана</b><br>Технологический центр.');
  L.marker([370, 340], {icon: imperialIcon}).addTo(imperialLayer)
    .bindPopup('<b>Агдель</b><br>Портовый город.');
  L.marker([680, 760], {icon: imperialIcon}).addTo(imperialLayer)
    .bindPopup('<b>Кронхейм</b><br>Военный город.');



  var ShuggotLayer = L.layerGroup();
  L.imageOverlay('/images/map-2.svg', bounds).addTo(ShuggotLayer);
  // Метки для Шуггота...

  var VeranaLayer = L.layerGroup();
  L.imageOverlay('/images/map-3.svg', bounds).addTo(VeranaLayer);
  // Метки для Вераны...




  imperialLayer.addTo(map);
  map.fitBounds(bounds);

  var baseMaps = {
    "💜 Империя": imperialLayer,
    "🐀 Шуггот": ShuggotLayer,
    "🏭 Верана": VeranaLayer
  };

  L.control.layers(baseMaps, null, { position: 'bottomleft' }).addTo(map);

</script>

</body>
</html>
